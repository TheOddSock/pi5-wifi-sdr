<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 564" role="img" aria-labelledby="demonstration-title demonstration-desc">
<title id="demonstration-title">Two bursts in five minutes</title>
<desc id="demonstration-desc">Measured public aggregates from known-signal-findings.json. 244,160 checked frames span 300.025 seconds of Pi host receipt time. Two short source bursts, each capped at two seconds, occur at approximately 10 and 277 elapsed seconds; timeline marker widths are exaggerated. Four ON-window median fitted amplitudes and matched adjacent OFF95 amplitudes, in sample counts, are respectively 211.444 versus 2.586; 189.876 versus 2.491; 194.065 versus 2.466; 178.397 versus 2.486. All 80 preset RF chunks pass. The weakest chunk&#x27;s ratio is 26.733, above the fixed tenfold requirement. Amplitudes are not calibrated RF power and host timestamps are not RF or ADC clock calibration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5edee4"/></marker></defs>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
