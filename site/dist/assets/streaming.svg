<text x="210" y="132" font-size="19" fill="#a6b2c6" text-anchor="middle" font-weight="400">Circular source sample memory</text>
<path d="M210,146 L210,167" fill="none" stroke="#5edee4" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="24" y="174" width="372" height="65" rx="10" fill="none" stroke="#5edee4" stroke-width="1.5"/>
