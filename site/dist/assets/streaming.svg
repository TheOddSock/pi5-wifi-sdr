<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 650" role="img" aria-labelledby="streaming-title streaming-desc">
<title id="streaming-title">Collect, publish, reuse</title>
<desc id="streaming-desc">Explanatory schematic, not measured timing. The active collector repeatedly writes its source sample ring. Firmware selects completed inputs, checks lag, and publishes complete blocks into a different RAM ring with sequence and checksum metadata. A schematic producer cycle fills a block, commits it, advances to another slot, then eventually overwrites old slots. The twin6 ring has 32 slots. Publisher reuse follows its own schedule; a late reader fails with an overrun instead of releasing or blocking slots. Linux concurrently reads committed blocks into a disk queue while collection remains active.</desc>
