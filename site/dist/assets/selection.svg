<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 615" role="img" aria-labelledby="selection-title selection-desc">
<title id="selection-title">Select fewer positions</title>
<desc id="selection-desc">Explanatory sample-position schematic. Ordinary stride16 selection keeps one of sixteen input positions for each output. The twin6 partial filter combines positions 0, 1, 2, 8, 9 and 10, then advances sixteen positions. Its exact signed nested averaging includes intermediate rounding. Partial filtering can reduce selected lines, but a general low-pass or alias-free response has not been established. Highlighted cells indicate contributing positions, not measured signal amplitudes.</desc>
