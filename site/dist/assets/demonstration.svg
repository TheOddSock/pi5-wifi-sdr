<rect x="39.87" y="45" width="8" height="18" rx="1" fill="#ffc477" stroke="#ffc477" stroke-width="1.5"/>
<path d="M43.86567038586391,43 L43.86567038586391,29" fill="none" stroke="#ffc477" stroke-width="1.5"/>
<rect x="356.68" y="45" width="8" height="18" rx="1" fill="#ffc477" stroke="#ffc477" stroke-width="1.5"/>
<path d="M360.6790696884303,43 L360.6790696884303,29" fill="none" stroke="#ffc477" stroke-width="1.5"/>
<text x="32" y="24" font-size="18" fill="#ffc477" text-anchor="start" font-weight="400">≈10 s</text>
<text x="388" y="24" font-size="18" fill="#ffc477" text-anchor="end" font-weight="400">≈277 s</text>
<path d="M32.0,58 L32.0,65" fill="none" stroke="#42516b" stroke-width="1.5"/>
<text x="32.0" y="86" font-size="18" fill="#a6b2c6" text-anchor="start" font-weight="400">0</text>
<path d="M209.98505578795863,58 L209.98505578795863,65" fill="none" stroke="#42516b" stroke-width="1.5"/>
<text x="209.98505578795863" y="86" font-size="18" fill="#a6b2c6" text-anchor="middle" font-weight="400">150</text>
<path d="M387.97011157591726,58 L387.97011157591726,65" fill="none" stroke="#42516b" stroke-width="1.5"/>
<text x="387.97011157591726" y="86" font-size="18" fill="#a6b2c6" text-anchor="end" font-weight="400">300 s</text>
<text x="24" y="116" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="400">Two short bursts, each capped at 2 s</text>
<text x="24" y="143" font-size="18" fill="#a6b2c6" text-anchor="start" font-weight="400">Marker widths exaggerated; times approximate</text>
<rect x="24" y="170" width="12" height="12" rx="2" fill="#5edee4" stroke="#5edee4" stroke-width="1.5"/>
<text x="46" y="183" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="400">ON median</text>
<rect x="226" y="170" width="12" height="12" rx="2" fill="#ffc477" stroke="#ffc477" stroke-width="1.5"/>
<text x="248" y="183" font-size="19" fill="#e8edf5" text-anchor="start" font-weight="400">Adjacent OFF95</text>
<text x="24" y="213" font-size="19" fill="#a6b2c6" text-anchor="start" font-weight="400">Fitted amplitude • sample counts</text>
