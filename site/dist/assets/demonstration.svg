<rect x="32" y="490" width="249.755" height="10" rx="1" fill="#5edee4" stroke="#5edee4" stroke-width="1.5"/>
<rect x="32" y="510" width="3.481" height="5" rx="1" fill="#ffc477" stroke="#ffc477" stroke-width="1.5"/>
<text x="396" y="500" font-size="18" fill="#5edee4" text-anchor="end" font-weight="400">178.4</text>
