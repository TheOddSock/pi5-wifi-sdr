<text x="115" y="346" font-size="19" fill="#e8edf5" text-anchor="middle" font-weight="400">1 • fill</text>
<rect x="230" y="318" width="150" height="43" rx="10" fill="none" stroke="#5edee4" stroke-width="1.5"/>
